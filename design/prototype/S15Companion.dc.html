</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@500;700&amp;family=Fira+Code:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.app{--serif:'Noto Serif SC',serif;--sans:'Noto Sans SC',system-ui,sans-serif;--mono:'Fira Code',ui-monospace,monospace}
.t-light{--paper:#F7F4EE;--panel:#FFFDF9;--sunk:#EFEAE1;--ink:#1C1A17;--ink2:#4E4A44;--muted:#6F6A62;--line:#E6E0D5;--line2:#D2CABC;--red:#C0282F;--mark:#F4E3AE;--onred:#FFFFFF;--shadow:rgba(28,26,23,.14)}
.t-dark{--paper:#1A1815;--panel:#221F1B;--sunk:#2A2621;--ink:#ECE6DB;--ink2:#C4BDB1;--muted:#A39C90;--line:#332F29;--line2:#48423A;--red:#E66B6F;--mark:#5A4919;--onred:#1A1815;--shadow:rgba(0,0,0,.45)}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);flex-shrink:0}
.dot.on{background:var(--ink)}
.dot.red{background:var(--red)}
.dot.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.dot.now{background:var(--red);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;outline:none;resize:none;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a{color:inherit;text-decoration:none}
mark{background:var(--mark);color:var(--ink);border-radius:2px;padding:0 1px}
.tab{color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.flt{color:var(--muted);border-bottom:1.5px solid transparent}
.flt.on{color:var(--ink);border-bottom-color:var(--ink)}
.side{color:var(--ink2)}
.side.on{color:var(--red)}
.sel{background:var(--sunk)}
.seg{color:var(--muted);border-bottom:2px solid transparent}
.seg.on{color:var(--ink);border-bottom-color:var(--red)}
.grp{color:var(--muted);border-left:2px solid transparent}
.grp.on{color:var(--ink);border-left-color:var(--red)}
.sw{width:40px;height:22px;border-radius:11px;background:var(--line2);position:relative;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel)}
.sw.on{background:var(--red)}
.sw.on::after{left:21px}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid var(--line2);border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--panel);white-space:nowrap}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--sunk);color:var(--ink2);flex-shrink:0;box-shadow:0 0 0 1.5px var(--paper)}
.rel{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-family:var(--mono);font-size:15px;color:var(--ink2);flex-shrink:0}
.sup{vertical-align:super;font-size:11px;font-family:var(--mono);color:var(--red);padding:0 2px;line-height:1}
.lbl{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid var(--line2);border-radius:4px;font-family:var(--sans);font-size:11px;color:var(--muted);vertical-align:3px;margin:0 2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;font-size:14px;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--red);color:var(--onred);border-color:var(--red)}
.menu{background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px var(--shadow)}
.ctx{padding:2px 6px;border:1px solid var(--line);border-radius:4px}
.chev.on{transform:rotate(90deg)}
</style>
</helmet>
<div class="app {{themeClass}}" style="width:1440px;height:900px;position:relative;overflow:hidden;display:grid;grid-template-columns:64px minmax(0,1fr);background:var(--paper);color:var(--ink);font-family:var(--sans)">
<nav aria-label="主导航" style="border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px">
<a href="Companion.dc.html" aria-label="伙伴" title="伙伴" style="position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:20px">
<img src="/_blob/534ec8071ddfdf6c7d1ed4414f26015e" alt="" style="width:34px;height:34px;border-radius:50%;background:var(--sunk);object-fit:cover">
<span style="position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--paper)"></span>
</a>
<a href="Main.dc.html" style="position:relative;width:64px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
<span style="font-size:11px">工作台</span>
</a>

<span style="font-size:11px">资料库</span>
</a>
<a href="Settings.dc.html" style="position:relative;width:64px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
<span style="font-size:11px">设置</span>
</a>
<div style="flex-grow:1"></div>
<button aria-label="切换明暗" title="明暗" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</button>
</nav>
<div style="display:grid;grid-template-columns:560px minmax(0,1fr);min-width:0">
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px">
<img src="/_blob/1790b7672614ac5bd39ce99b2b0033dc" alt="小熊" style="width:260px;height:400px;object-fit:contain">
<p style="margin:0;max-width:400px;text-align:center;font-family:var(--serif);font-size:22px;line-height:1.6">阿念的生日快到了</p>
</div>
<div style="border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;padding:40px 64px 40px 56px;gap:28px">
<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:flex-start;gap:12px;padding:16px 12px 16px 20px;border:1px solid var(--line2);border-radius:12px;background:var(--panel)">
<p style="margin:0;flex-grow:1;font-family:var(--serif);font-size:18px;line-height:1.7">阿念的生日还有 12 天。她上个月说想要一个轻便的小桌板<button class="sup">1</button>。</p>
<button aria-label="关掉" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="display:flex;align-items:flex-start;gap:12px;padding:16px 12px 16px 20px;border:1px solid var(--line2);border-radius:12px;background:var(--panel)">
<p style="margin:0;flex-grow:1;font-family:var(--serif);font-size:18px;line-height:1.7">到成都了。你存过：宽窄巷子早上 9 点前人少<button class="sup">1</button>。</p>
<button aria-label="关掉" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>
<div style="display:flex;gap:28px;border-bottom:1px solid var(--line)"><button class="seg on" style="padding:8px 0 12px;font-family:var(--serif);font-size:22px;font-weight:700">聊聊</button><button class="seg" style="padding:8px 0 12px;font-family:var(--serif);font-size:22px;font-weight:700">回顾</button><button class="seg" style="padding:8px 0 12px;font-family:var(--serif);font-size:22px;font-weight:700">专注</button><button class="seg" style="padding:8px 0 12px;font-family:var(--serif);font-size:22px;font-weight:700">安排</button></div>
<div style="flex-grow:1"></div>
<div style="display:flex;align-items:center;gap:10px;height:48px;border-bottom:1px solid var(--line2)">
<input aria-label="和小熊说" placeholder="说点什么" style="flex-grow:1;font-size:15px">
<button aria-label="发送" style="width:36px;height:36px;border-radius:50%;background:var(--red);color:var(--onred);display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="stroke-width:2"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
