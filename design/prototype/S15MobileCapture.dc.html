<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机 · 一键记</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@500;700&amp;family=Fira+Code:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.app{--serif:'Noto Serif SC',serif;--sans:'Noto Sans SC',system-ui,sans-serif;--mono:'Fira Code',ui-monospace,monospace}
.t-light{--paper:#F7F4EE;--panel:#FFFDF9;--sunk:#EFEAE1;--ink:#1C1A17;--ink2:#4E4A44;--muted:#6F6A62;--line:#E6E0D5;--line2:#D2CABC;--red:#C0282F;--mark:#F4E3AE;--onred:#FFFFFF;--shadow:rgba(28,26,23,.14)}
.t-dark{--paper:#1A1815;--panel:#221F1B;--sunk:#2A2621;--ink:#ECE6DB;--ink2:#C4BDB1;--muted:#A39C90;--line:#332F29;--line2:#48423A;--red:#E66B6F;--mark:#5A4919;--onred:#1A1815;--shadow:rgba(0,0,0,.45)}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);flex-shrink:0}
.dot.on{background:var(--ink)}
.dot.red{background:var(--red)}
.dot.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.dot.now{background:var(--red);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;outline:none;resize:none;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a{color:inherit;text-decoration:none}
mark{background:var(--mark);color:var(--ink);border-radius:2px;padding:0 1px}
.tab{color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.flt{color:var(--muted);border-bottom:1.5px solid transparent}
.flt.on{color:var(--ink);border-bottom-color:var(--ink)}
.side{color:var(--ink2)}
.side.on{color:var(--red)}
.sel{background:var(--sunk)}
.seg{color:var(--muted);border-bottom:2px solid transparent}
.seg.on{color:var(--ink);border-bottom-color:var(--red)}
.grp{color:var(--muted);border-left:2px solid transparent}
.grp.on{color:var(--ink);border-left-color:var(--red)}
.sw{width:40px;height:22px;border-radius:11px;background:var(--line2);position:relative;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel)}
.sw.on{background:var(--red)}
.sw.on::after{left:21px}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid var(--line2);border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--panel);white-space:nowrap}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--sunk);color:var(--ink2);flex-shrink:0;box-shadow:0 0 0 1.5px var(--paper)}
.rel{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-family:var(--mono);font-size:15px;color:var(--ink2);flex-shrink:0}
.sup{vertical-align:super;font-size:11px;font-family:var(--mono);color:var(--red);padding:0 2px;line-height:1}
.lbl{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid var(--line2);border-radius:4px;font-family:var(--sans);font-size:11px;color:var(--muted);vertical-align:3px;margin:0 2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;font-size:14px;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--red);color:var(--onred);border-color:var(--red)}
.menu{background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px var(--shadow)}
.ctx{padding:2px 6px;border:1px solid var(--line);border-radius:4px}
.chev.on{transform:rotate(90deg)}
</style>
</helmet>
<div class="app {{themeClass}}" style="width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--sans)">
<header style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)">
<a href="Companion.dc.html" aria-label="伙伴" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><img src="/_blob/a1342611c9d3b97bd9c8b4358f376583" alt="" style="width:32px;height:32px;border-radius:50%;background:var(--sunk);object-fit:cover"></a>
<button aria-label="切换项目" style="flex-grow:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;font-size:15px"><span style="width:6px;height:6px;border-radius:50%;background:var(--red)"></span><span>收件箱</span><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="color:var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></button>
<span title="待上传" style="height:32px;padding:0 10px;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px"><span class="dot on"></span><span>3</span></span>
</header>
<div style="flex-grow:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:24px 20px;position:relative">
<span style="position:relative;width:168px;height:168px;display:flex;align-items:center;justify-content:center">
<span aria-hidden="true" style="position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);opacity:.25"></span>
<span aria-hidden="true" style="position:absolute;inset:22px;border-radius:50%;border:2px solid var(--red);opacity:.5"></span>
<button aria-label="按住说话" style="width:96px;height:96px;border-radius:999px;background:var(--red);color:var(--onred);display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" width="34" height="34" aria-hidden="true" style="stroke-width:1.8"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
</span>
<div style="width:100%;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px 6px 6px 14px">
<input aria-label="记一下" placeholder="记一下" style="flex-grow:1;font-size:16px;height:40px">
<button aria-label="保存" style="width:38px;height:38px;border-radius:50%;background:var(--red);color:var(--onred);display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" style="stroke-width:2"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</div>
<div role="status" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);height:40px;padding:0 18px;border-radius:20px;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:8px;font-size:14px"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>已记住</div>
</div>
<nav aria-label="主导航" style="height:60px;flex-shrink:0;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));border-top:1px solid var(--line)">
<a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--red)"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg><span style="font-size:11px;color:var(--ink)">工作台</span></a><a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg><span style="font-size:11px;">资料库</span></a><a href="#" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg><span style="font-size:11px;">设置</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>

  }
