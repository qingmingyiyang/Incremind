<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机 · 资料库</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@500;700&amp;family=Fira+Code:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.app{--serif:'Noto Serif SC',serif;--sans:'Noto Sans SC',system-ui,sans-serif;--mono:'Fira Code',ui-monospace,monospace}
.t-light{--paper:#F7F4EE;--panel:#FFFDF9;--sunk:#EFEAE1;--ink:#1C1A17;--ink2:#4E4A44;--muted:#6F6A62;--line:#E6E0D5;--line2:#D2CABC;--red:#C0282F;--mark:#F4E3AE;--onred:#FFFFFF}
.t-dark{--paper:#1A1815;--panel:#221F1B;--sunk:#2A2621;--ink:#ECE6DB;--ink2:#C4BDB1;--muted:#A39C90;--line:#332F29;--line2:#48423A;--red:#E66B6F;--mark:#5A4919;--onred:#1A1815}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);flex-shrink:0}
.dot.on{background:var(--ink)}
.dot.red{background:var(--red)}
.dot.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a{color:inherit;text-decoration:none}
mark{background:var(--mark);color:var(--ink);border-radius:2px;padding:0 1px}
.tab{color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.flt{color:var(--muted)}
.flt.on{color:var(--ink)}
.crumb{color:var(--muted)}
.crumb.on{color:var(--red)}
</style>
</helmet>
<div class="app {{themeClass}}" style="width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--sans)">

<header style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px">
<a href="Companion.dc.html" aria-label="伙伴" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">
<img src="/_blob/534ec8071ddfdf6c7d1ed4414f26015e" alt="" style="width:32px;height:32px;border-radius:50%;background:var(--sunk);object-fit:cover">
</a>
<button aria-label="切换项目" style="flex-grow:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;font-size:15px">
<span style="width:6px;height:6px;border-radius:50%;background:var(--red)"></span><span>创作助手</span>
<svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="color:var(--muted)"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<button aria-label="搜索" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink2)"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg></button>
</header>

<div style="display:flex;gap:20px;padding:0 16px;border-bottom:1px solid var(--line)">
<sc-for list="{{layers}}" as="ly" hint-placeholder-count="4">
<button class="tab {{ly.cls}}" onClick="{{ly.pick}}" style="padding:6px 0 10px;font-family:var(--serif);font-size:19px;font-weight:700">{{ly.label}}</button>
</sc-for>
</div>

<div style="display:flex;gap:18px;padding:12px 16px 4px;font-size:14px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button class="flt {{f.cls}}" onClick="{{f.pick}}" style="height:32px;display:flex;align-items:center;gap:6px"><span class="dot {{f.dot}}"></span>{{f.label}}<span style="font-family:var(--mono);font-size:12px;color:var(--muted)">{{f.count}}</span></button>
</sc-for>
</div>

<div style="flex-grow:1;min-height:0;overflow:auto;padding:0 16px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<button onClick="{{r.open}}" style="width:100%;display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line)">
<span class="dot {{r.dot}}"></span>
<span style="flex-grow:1;font-size:15px;line-height:1.5;color:{{r.color}}">{{r.text}}</span>
<span style="font-family:var(--mono);font-size:11px;color:var(--muted)">{{r.meta}}</span>
</button>
</sc-for>
</div>

<nav aria-label="主导航" style="height:60px;flex-shrink:0;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));border-top:1px solid var(--line)">
<a href="Mobile.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg><span style="font-size:11px">工作台</span>
</a>
<a href="MobileLibrary.dc.html" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--red)">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg><span style="font-size:11px;color:var(--ink)">资料库</span>
</a>
<a href="Settings.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg><span style="font-size:11px">设置</span>
</a>
</nav>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="下钻" style="position:absolute;inset:0;z-index:6;background:var(--panel);display:flex;flex-direction:column">
<div style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:2px;padding:0 8px 0 16px;border-bottom:1px solid var(--line)">
<sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="4">
<button class="crumb {{cr.cls}}" onClick="{{cr.pick}}" style="height:44px;padding:0 4px;font-size:14px">{{cr.label}}</button>
</sc-for>
<div style="flex-grow:1"></div>
<button aria-label="关闭" onClick="{{close}}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="flex-grow:1;overflow:auto;padding:24px 20px;display:flex;flex-direction:column;gap:18px">
<sc-if value="{{lv0}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:16px">
<p style="margin:0;font-family:var(--serif);font-size:24px;line-height:1.5;font-weight:700">{{insText}}</p>
<div style="font-size:12px;color:var(--muted);font-family:var(--mono)">{{insMeta}}</div>
<div style="display:flex;gap:10px">
<sc-if value="{{insPending}}" hint-placeholder-val="{{ true }}"><button onClick="{{confirm}}" style="height:44px;padding:0 20px;border-radius:4px;background:var(--red);color:var(--onred);font-size:15px">确认</button></sc-if>
<button onClick="{{forget}}" style="height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:4px;font-size:15px;color:var(--ink2)">{{forgetLabel}}</button>
</div>
</div>
</sc-if>
<sc-if value="{{lv1}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-family:var(--serif);font-size:21px">短视频开头的三个钩子</h2><p style="margin:0;font-size:15px;line-height:1.85;color:var(--ink2)">开头三秒决定去留；悬念、反差、具体数字三种钩子最有效。</p></div>
</sc-if>
<sc-if value="{{lv2}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.75">
<div style="font-size:12px;color:var(--muted)">○ 未核对</div>
<div><div style="font-size:12px;color:var(--muted)">事实</div><div>观众在开头三秒决定是否继续 <span style="color:var(--red);font-family:var(--mono);font-size:12px">↩</span></div><div>具体数字比形容词更抓人 <span style="color:var(--red);font-family:var(--mono);font-size:12px">↩</span></div></div>
<div><div style="font-size:12px;color:var(--muted)">待办</div><div>下期开头改用数字钩子</div></div>
</div>
</sc-if>
<sc-if value="{{lv3}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:12px"><div style="font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all">mp.weixin.qq.com/s/hook-3s</div><p style="margin:0;font-size:15px;line-height:1.95;color:var(--ink2)">很多人把视频做坏，不是内容不好，而是开头没留住人。<mark>观众通常在开头三秒内决定是否继续看</mark>。</p></div>
</sc-if>
<div style="flex-grow:1"></div>
<sc-if value="{{canDown}}" hint-placeholder-val="{{ true }}">
<button onClick="{{down}}" aria-label="下钻一层" style="align-self:center;width:52px;height:52px;border:1px solid var(--line2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2)"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></button>
</sc-if>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { layer: 0, filter: 'pending', states: {}, open: null, level: 0 };
  }
  renderVals() {
    const s = this.state;
    const set = (p) => this.setState(p);
    const ins = [
      { id: 'i1', text: '开头 3 秒决定完播率', scene: '选题', src: 2, state: 'pending' },
      { id: 'i2', text: '标题用具体数字比形容词更有效', scene: '选题', src: 1, state: 'pending' },
      { id: 'i7', text: '冷门话题先看搜索量再决定做不做', scene: '选题', src: 2, state: 'pending' },
      { id: 'i3', text: '钩子公式：悬念 + 反差 + 利益点', scene: '选题', src: 3, state: 'active' },
      { id: 'i4', text: '竖屏字幕放在画面中下三分之一', scene: '剪辑', src: 1, state: 'active' },
      { id: 'i6', text: '评论区置顶一个问题引导互动', scene: '选题', src: 1, state: 'forgotten' }
    ];
    const stOf = (i) => s.states[i.id] || i.state;
    const labels = { pending: '待确认', active: '生效', forgotten: '已遗忘' };
    const dots = { pending: 'red', active: 'on', forgotten: 'ghost' };
    const cnt = { pending: 0, active: 0, forgotten: 0 };
    ins.forEach((i) => { cnt[stOf(i)] += 1; });
    const cur = s.open ? ins.filter((i) => i.id === s.open)[0] : null;
    const curSt = cur ? stOf(cur) : 'active';
    return {
      themeClass: this.props.dark ? 't-dark' : 't-light',
      layers: ['认识', '摘要', '整理稿', '原件'].map((l, i) => ({ label: l, cls: s.layer === i ? 'on' : '', pick: () => set({ layer: i }) })),
      filters: ['pending', 'active', 'forgotten'].map((k) => ({ label: labels[k], count: String(cnt[k]), dot: dots[k], cls: s.filter === k ? 'on' : '', pick: () => set({ filter: k }) })),
      rows: ins.filter((i) => stOf(i) === s.filter).map((i) => ({ text: i.text, dot: dots[stOf(i)], meta: i.scene, color: stOf(i) === 'forgotten' ? 'var(--muted)' : 'var(--ink)', open: () => set({ open: i.id, level: 0 }) })),
      sheetOpen: !!cur,
      close: () => set({ open: null }),
      crumbs: ['认识', '摘要', '整理稿', '原件'].map((l, i) => ({ label: (i > 0 ? '› ' : '') + l, cls: s.level === i ? 'on' : '', pick: () => set({ level: i }) })),
      lv0: s.level === 0, lv1: s.level === 1, lv2: s.level === 2, lv3: s.level === 3,
      insText: cur ? cur.text : '',
      insMeta: cur ? cur.scene + ' · ' + cur.src + ' 源 · ' + labels[curSt] : '',
      insPending: curSt === 'pending',
      confirm: () => cur && this.setState({ states: Object.assign({}, this.state.states, { [cur.id]: 'active' }) }),
      forgetLabel: curSt === 'forgotten' ? '恢复' : '遗忘',
      forget: () => cur && this.setState({ states: Object.assign({}, this.state.states, { [cur.id]: curSt === 'forgotten' ? 'active' : 'forgotten' }) }),
      canDown: s.level < 3,
      down: () => set({ level: Math.min(3, s.level + 1) })
    };
  }
}
</script>
</body>
</html>
