<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ChatGPT 里的卡片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@500;700&amp;family=Fira+Code:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.app{--serif:'Noto Serif SC',serif;--sans:'Noto Sans SC',system-ui,sans-serif;--mono:'Fira Code',ui-monospace,monospace}
.t-light{--paper:#F7F4EE;--panel:#FFFDF9;--sunk:#EFEAE1;--ink:#1C1A17;--ink2:#4E4A44;--muted:#6F6A62;--line:#E6E0D5;--line2:#D2CABC;--red:#C0282F;--mark:#F4E3AE;--onred:#FFFFFF;--shadow:rgba(28,26,23,.14)}
.t-dark{--paper:#1A1815;--panel:#221F1B;--sunk:#2A2621;--ink:#ECE6DB;--ink2:#C4BDB1;--muted:#A39C90;--line:#332F29;--line2:#48423A;--red:#E66B6F;--mark:#5A4919;--onred:#1A1815;--shadow:rgba(0,0,0,.45)}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);flex-shrink:0}
.dot.on{background:var(--ink)}
.dot.red{background:var(--red)}
.dot.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.dot.now{background:var(--red);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;outline:none;resize:none;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a{color:inherit;text-decoration:none}
mark{background:var(--mark);color:var(--ink);border-radius:2px;padding:0 1px}
.tab{color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.flt{color:var(--muted);border-bottom:1.5px solid transparent}
.flt.on{color:var(--ink);border-bottom-color:var(--ink)}
.side{color:var(--ink2)}
.side.on{color:var(--red)}
.sel{background:var(--sunk)}
.seg{color:var(--muted);border-bottom:2px solid transparent}
.seg.on{color:var(--ink);border-bottom-color:var(--red)}
.grp{color:var(--muted);border-left:2px solid transparent}
.grp.on{color:var(--ink);border-left-color:var(--red)}
.sw{width:40px;height:22px;border-radius:11px;background:var(--line2);position:relative;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel)}
.sw.on{background:var(--red)}
.sw.on::after{left:21px}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid var(--line2);border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--panel);white-space:nowrap}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--sunk);color:var(--ink2);flex-shrink:0;box-shadow:0 0 0 1.5px var(--paper)}
.rel{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-family:var(--mono);font-size:15px;color:var(--ink2);flex-shrink:0}
.sup{vertical-align:super;font-size:11px;font-family:var(--mono);color:var(--red);padding:0 2px;line-height:1}
.lbl{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid var(--line2);border-radius:4px;font-family:var(--sans);font-size:11px;color:var(--muted);vertical-align:3px;margin:0 2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;font-size:14px;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--red);color:var(--onred);border-color:var(--red)}
.menu{background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px var(--shadow)}
.ctx{padding:2px 6px;border:1px solid var(--line);border-radius:4px}
.chev.on{transform:rotate(90deg)}
</style>
</helmet>
<div style="width:1440px;height:900px;background:#FFFFFF;font-family:system-ui,'Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden">
<div style="position:absolute;left:24px;top:18px;font-family:'Fira Code',ui-monospace,monospace;font-size:12px;color:#6B6B6B">ChatGPT（示意）</div>
<div style="width:760px;padding:64px 0 24px;display:flex;flex-direction:column;gap:20px">
<div style="align-self:flex-end;max-width:520px;background:#EDEDED;color:#1F1F1F;border-radius:18px;padding:10px 16px;font-size:15px;line-height:1.6">帮我想想成都第二天怎么安排</div>
<p style="margin:0;font-size:15px;line-height:1.75;color:#1F1F1F">我从第二大脑找到了这些：</p>
<div class="app {{themeClass}}" style="border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--ink);font-family:var(--sans);padding:14px 18px">
<div style="display:flex;align-items:center;gap:10px;padding-bottom:10px"><span style="font-size:14px;font-weight:500">第二大脑</span><span style="font-family:var(--mono);font-size:12px;color:var(--muted)">召回 4</span><div style="flex-grow:1"></div><a href="#" style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--red)">打开<svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></a></div>
<div style="display:grid;grid-template-columns:36px 28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:40px;border-top:1px solid var(--line);font-size:14px"><span style="font-family:var(--mono);font-size:12px;color:var(--red)">M1</span><span style="font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;text-align:center;padding:1px 0">认</span><span>宽窄巷子早上 9 点前人少</span><span style="font-family:var(--mono);font-size:12px;color:var(--muted)">成都</span></div><div style="display:grid;grid-template-columns:36px 28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:40px;border-top:1px solid var(--line);font-size:14px"><span style="font-family:var(--mono);font-size:12px;color:var(--red)">M2</span><span style="font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;text-align:center;padding:1px 0">认</span><span>第二天别排太满，留半天逛街</span><span style="font-family:var(--mono);font-size:12px;color:var(--muted)">成都</span></div><div style="display:grid;grid-template-columns:36px 28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:40px;border-top:1px solid var(--line);font-size:14px"><span style="font-family:var(--mono);font-size:12px;color:var(--red)">M3</span><span style="font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;text-align:center;padding:1px 0">摘</span><span>成都吃喝攻略</span><span style="font-family:var(--mono);font-size:12px;color:var(--muted)">小红书</span></div><div style="display:grid;grid-template-columns:36px 28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:40px;border-top:1px solid var(--line);font-size:14px"><span style="font-family:var(--mono);font-size:12px;color:var(--red)">M4</span><span style="font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;text-align:center;padding:1px 0">补</span><span>排行程前先查景点是否周一闭馆</span><span style="font-family:var(--mono);font-size:12px;color:var(--muted)">项目层</span></div>
</div>
<p style="margin:0;font-size:15px;line-height:1.75;color:#1F1F1F">建议上午去宽窄巷子 [M1]，下午留给春熙路 [M2]。要把“第二天只排一个上午景点”记成认识吗？</p>
<div class="app {{themeClass}}" style="border:1px solid var(--line2);border-radius:12px;background:var(--panel);color:var(--ink);font-family:var(--sans);padding:14px 18px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)"><span class="dot red"></span>待确认<span style="font-family:var(--mono)">· 旅行 / 成都</span></div>
<p style="margin:0;font-family:var(--serif);font-size:20px;line-height:1.5;font-weight:700">第二天只排一个上午景点</p>
<div style="display:flex;gap:10px"><button class="btn pri">确认</button><button class="btn" style="color:var(--ink2)">丢弃</button></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 't-dark' : 't-light' };
  }
}
</script>
</body>
</html>
