<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>伙伴</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@500;700&amp;family=Fira+Code:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.app{--serif:'Noto Serif SC',serif;--sans:'Noto Sans SC',system-ui,sans-serif;--mono:'Fira Code',ui-monospace,monospace}
.t-light{--paper:#F7F4EE;--panel:#FFFDF9;--sunk:#EFEAE1;--ink:#1C1A17;--ink2:#4E4A44;--muted:#6F6A62;--line:#E6E0D5;--line2:#D2CABC;--red:#C0282F;--onred:#FFFFFF}
.t-dark{--paper:#1A1815;--panel:#221F1B;--sunk:#2A2621;--ink:#ECE6DB;--ink2:#C4BDB1;--muted:#A39C90;--line:#332F29;--line2:#48423A;--red:#E66B6F;--onred:#1A1815}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input{font:inherit;color:var(--ink);background:transparent;border:0;outline:none}
input::placeholder{color:var(--muted)}
a{color:inherit;text-decoration:none}
.mode{color:var(--muted);border-bottom:2px solid transparent}
.mode.on{color:var(--ink);border-bottom-color:var(--red)}
.todo{accent-color:var(--red);width:18px;height:18px}
</style>
</helmet>
<div class="app {{themeClass}}" style="width:1440px;height:900px;position:relative;overflow:hidden;display:grid;grid-template-columns:64px minmax(0,1fr);background:var(--paper);color:var(--ink);font-family:var(--sans)">

<nav aria-label="主导航" style="border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px">
<a href="Companion.dc.html" aria-current="page" aria-label="伙伴" title="伙伴" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;border-radius:50%;box-shadow:0 0 0 2px var(--red)">
<img src="/_blob/a1342611c9d3b97bd9c8b4358f376583" alt="" style="width:34px;height:34px;border-radius:50%;background:var(--sunk);object-fit:cover">
</a>
<a href="Main.dc.html" style="width:64px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
<span style="font-size:11px">工作台</span>
</a>
<a href="Library.dc.html" style="width:64px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
<span style="font-size:11px">资料库</span>
</a>
<a href="Settings.dc.html" style="width:64px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
<span style="font-size:11px">设置</span>
</a>
<div style="flex-grow:1"></div>
<button aria-label="切换明暗" title="明暗" onClick="{{toggleTheme}}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)">
<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</button>
</nav>

<div style="display:grid;grid-template-columns:560px minmax(0,1fr);min-width:0">
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px">
<img src="{{bigBear}}" alt="小熊" style="width:260px;height:400px;object-fit:contain">
<p style="margin:0;max-width:400px;text-align:center;font-family:var(--serif);font-size:22px;line-height:1.6;color:var(--ink)">{{bearLine}}</p>
</div>

<div style="border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;padding:40px 64px 40px 56px">
<div style="display:flex;gap:28px;border-bottom:1px solid var(--line)">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
<button class="mode {{m.cls}}" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="padding:8px 0 12px;font-family:var(--serif);font-size:22px;font-weight:700">{{m.label}}</button>
</sc-for>
</div>

<div style="flex-grow:1;min-height:0;display:flex;flex-direction:column;padding-top:32px">

<sc-if value="{{isChat}}" hint-placeholder-val="{{ true }}">
<div style="flex-grow:1;display:flex;flex-direction:column;gap:18px;min-height:0">
<div style="flex-grow:1;display:flex;flex-direction:column;gap:18px;overflow:auto">
<sc-for list="{{chat}}" as="c" hint-placeholder-count="3">
<div style="display:flex;justify-content:{{c.justify}}">
<div style="max-width:460px;padding:10px 14px;border-radius:12px;font-size:15px;line-height:1.7;background:{{c.bg}};color:var(--ink);font-family:{{c.font}}">{{c.text}}</div>
</div>
</sc-for>
</div>
<div style="display:flex;align-items:center;gap:10px;height:48px;border-bottom:1px solid var(--line2)">
<input aria-label="和小熊说" placeholder="说点什么" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" style="flex-grow:1;font-size:15px">
<button aria-label="发送" onClick="{{say}}" style="width:36px;height:36px;border-radius:50%;background:var(--red);color:var(--onred);display:flex;align-items:center;justify-content:center">
<svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="stroke-width:2"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
</button>
</div>
</div>
</sc-if>

<sc-if value="{{isReview}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:36px">
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:24px">
<div><div style="font-family:var(--serif);font-size:56px;font-weight:700;line-height:1">12</div><div style="margin-top:8px;font-size:14px;color:var(--muted)">记住</div></div>
<div><div style="font-family:var(--serif);font-size:56px;font-weight:700;line-height:1">8</div><div style="margin-top:8px;font-size:14px;color:var(--muted)">确认</div></div>
<div><div style="font-family:var(--serif);font-size:56px;font-weight:700;line-height:1;color:var(--muted)">1</div><div style="margin-top:8px;font-size:14px;color:var(--muted)">遗忘</div></div>
</div>
<div style="border-top:1px solid var(--line);padding-top:20px;font-size:16px;line-height:1.8;color:var(--ink2)">你这周最常记的是「选题」。</div>
</div>
</sc-if>

<sc-if value="{{isFocus}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow:1;display:flex;flex-direction:column;align-items:flex-start;gap:28px;padding-top:24px">
<div style="font-family:var(--mono);font-size:96px;font-weight:500;letter-spacing:0.02em;line-height:1">{{clock}}</div>
<button onClick="{{toggleClock}}" style="height:44px;padding:0 24px;border-radius:4px;background:var(--red);color:var(--onred);font-size:15px">{{clockLabel}}</button>
</div>
</sc-if>

<sc-if value="{{isPlan}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column">
<sc-for list="{{todos}}" as="t" hint-placeholder-count="3">
<label style="display:flex;align-items:center;gap:14px;min-height:60px;border-top:1px solid var(--line);font-size:16px;color:{{t.color}}">
<input type="checkbox" class="todo" checked="{{t.done}}" onChange="{{t.toggle}}">
<span style="flex-grow:1;text-decoration:{{t.deco}}">{{t.text}}</span>
<span style="font-size:12px;color:var(--muted);font-family:var(--mono)">{{t.from}}</span>
</label>
</sc-for>
</div>
</sc-if>

</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      darkOverride: null, mode: 'chat', draft: '',
      chat: [
        { me: false, text: '今天你记了一篇开头技巧。要不要聊聊下期怎么开场？' },
        { me: true, text: '好，用数字钩子试试' },
        { me: false, text: '那就“我做错的 5 个开头”，正好用上你确认的两条认识。' }
      ],
      secs: 1500, running: false,
      todos: { t1: false, t2: false, t3: true }
    };
    this.tick = null;
  }
  componentWillUnmount() { if (this.tick) clearInterval(this.tick); }
  renderVals() {
    const s = this.state;
    const dark = s.darkOverride === null ? !!this.props.dark : s.darkOverride;
    const set = (p) => this.setState(p);
    const say = () => {
      const t = this.state.draft.trim();
      if (!t) return;
      this.setState({ draft: '', chat: this.state.chat.concat([{ me: true, text: t }, { me: false, text: '记下了，放进收件箱。' }]) });
    };
    const lines = { chat: '在呢。', review: '这周收获不少。', focus: '我陪你专注一会儿。', plan: '从你记住的事里挑了三件。' };
    const mm = String(Math.floor(s.secs / 60)).padStart(2, '0');
    const ss = String(s.secs % 60).padStart(2, '0');
    const todoDefs = [
      { id: 't1', text: '下期开头改用数字钩子', from: '选题' },
      { id: 't2', text: '整理一套剪辑模板', from: '剪辑' },
      { id: 't3', text: '建一张选题搜索量表', from: '选题' }
    ];
    return {
      themeClass: dark ? 't-dark' : 't-light',
      toggleTheme: () => set({ darkOverride: !dark }),
      bigBear: s.mode === 'chat' ? '/_blob/1790b7672614ac5bd39ce99b2b0033dc' : '/_blob/a4b07d014ea0f58b654900350c1acf51',
      bearLine: lines[s.mode],
      modes: [['chat', '聊聊'], ['review', '回顾'], ['focus', '专注'], ['plan', '安排']].map((m) => ({ label: m[1], cls: s.mode === m[0] ? 'on' : '', pressed: s.mode === m[0], pick: () => set({ mode: m[0] }) })),
      isChat: s.mode === 'chat', isReview: s.mode === 'review', isFocus: s.mode === 'focus', isPlan: s.mode === 'plan',
      chat: s.chat.map((c) => ({ text: c.text, justify: c.me ? 'flex-end' : 'flex-start', bg: c.me ? 'var(--sunk)' : 'transparent', font: c.me ? 'var(--sans)' : 'var(--serif)' })),
      draft: s.draft,
      onDraft: (e) => set({ draft: e.target.value }),
      onKey: (e) => { const composing = e.nativeEvent && e.nativeEvent.isComposing; if (e.key === 'Enter' && !composing) { e.preventDefault(); say(); } },
      say: say,
      clock: mm + ':' + ss,
      clockLabel: s.running ? '暂停' : '开始',
      toggleClock: () => {
        if (this.state.running) { clearInterval(this.tick); this.tick = null; set({ running: false }); return; }
        this.tick = setInterval(() => { this.setState((p) => ({ secs: Math.max(0, p.secs - 1) })); }, 1000);
        set({ running: true });
      },
      todos: todoDefs.map((t) => ({
        text: t.text, from: t.from, done: !!s.todos[t.id],
        color: s.todos[t.id] ? 'var(--muted)' : 'var(--ink)',
        deco: s.todos[t.id] ? 'line-through' : 'none',
        toggle: () => this.setState({ todos: Object.assign({}, this.state.todos, { [t.id]: !this.state.todos[t.id] }) })
      }))
    };
  }
}
</script>
</body>
</html>
