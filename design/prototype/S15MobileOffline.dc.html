<style>
body{margin:0}
.app{--serif:'Noto Serif SC',serif;--sans:'Noto Sans SC',system-ui,sans-serif;--mono:'Fira Code',ui-monospace,monospace}
.t-light{--paper:#F7F4EE;--panel:#FFFDF9;--sunk:#EFEAE1;--ink:#1C1A17;--ink2:#4E4A44;--muted:#6F6A62;--line:#E6E0D5;--line2:#D2CABC;--red:#C0282F;--mark:#F4E3AE;--onred:#FFFFFF;--shadow:rgba(28,26,23,.14)}

.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);flex-shrink:0}
.dot.on{background:var(--ink)}
.dot.red{background:var(--red)}
.dot.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.dot.now{background:var(--red);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;outline:none;resize:none;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a{color:inherit;text-decoration:none}
mark{background:var(--mark);color:var(--ink);border-radius:2px;padding:0 1px}
.tab{color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}
.flt{color:var(--muted);border-bottom:1.5px solid transparent}
.flt.on{color:var(--ink);border-bottom-color:var(--ink)}
.side{color:var(--ink2)}
.side.on{color:var(--red)}
.sel{background:var(--sunk)}
.seg{color:var(--muted);border-bottom:2px solid transparent}
.seg.on{color:var(--ink);border-bottom-color:var(--red)}
.grp{color:var(--muted);border-left:2px solid transparent}
.grp.on{color:var(--ink);border-left-color:var(--red)}
.sw{width:40px;height:22px;border-radius:11px;background:var(--line2);position:relative;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel)}
.sw.on{background:var(--red)}
.sw.on::after{left:21px}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid var(--line2);border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--panel);white-space:nowrap}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--sunk);color:var(--ink2);flex-shrink:0;box-shadow:0 0 0 1.5px var(--paper)}
.rel{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-family:var(--mono);font-size:15px;color:var(--ink2);flex-shrink:0}
.sup{vertical-align:super;font-size:11px;font-family:var(--mono);color:var(--red);padding:0 2px;line-height:1}
.lbl{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid var(--line2);border-radius:4px;font-family:var(--sans);font-size:11px;color:var(--muted);vertical-align:3px;margin:0 2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;font-size:14px;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--red);color:var(--onred);border-color:var(--red)}
.menu{background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 32px var(--shadow)}
.ctx{padding:2px 6px;border:1px solid var(--line);border-radius:4px}
.chev.on{transform:rotate(90deg)}
