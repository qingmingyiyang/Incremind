# 与现有 nginx-ip.conf 同时启用。替换 SERVER_IP，沿用现有公网证书路径。
server {
    listen 8443 ssl http2 default_server;
    listen [::]:8443 ssl http2 default_server;
    server_name SERVER_IP;

    ssl_certificate /etc/letsencrypt/live/incremind-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/incremind-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;
    ssl_client_certificate /etc/chriptmas/android-mobile/client-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;

    server_tokens off;
    client_max_body_size 0;
    client_body_timeout 120s;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $incremind_connection_upgrade;
        include /etc/chriptmas/android-mobile/nginx-proxy-token.conf;
        proxy_set_header X-Incremind-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header Authorization "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $incremind_cache_control always;
    }
}
