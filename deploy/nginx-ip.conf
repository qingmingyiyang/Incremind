# 安装到 /etc/nginx/sites-available/incremind-ip；将 SERVER_IP 换成公网 IPv4。
# 先取得 incremind-ip 证书，再启用本站点，并停用临时的 incremind-http 站点。
map $http_upgrade $incremind_connection_upgrade {
    default upgrade;
    '' close;
}

# 只有成功返回的带版本资源允许长期缓存，页面、接口和错误均不缓存。
map "$status:$uri" $incremind_cache_control {
    default "no-store";
    "~^(200|206|304):/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|mjs|css|woff|woff2|ttf|png|jpg|jpeg|webp|svg|ico)$" "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name SERVER_IP;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/incremind-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://SERVER_IP$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name SERVER_IP;

    ssl_certificate /etc/letsencrypt/live/incremind-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/incremind-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IncremindTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # 上传大小沿用应用校验，避免 Nginx 默认 1 MB 拦截已有附件功能。
    client_max_body_size 0;
    client_body_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/wasm image/svg+xml;

    # 关闭访问日志，避免记录查询参数；配对凭据仍只放在浏览器 fragment 中。
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $incremind_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $incremind_cache_control always;
    }
}
