<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chriptmas OS 陪伴气泡</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <main class="overlay-card" aria-label="陪伴气泡">
      <header>
        <span id="kind">陪伴消息</span>
        <button id="close" type="button" aria-label="关闭气泡">×</button>
      </header>
      <p id="text" aria-live="polite">宠物正在这里陪着你。</p>
      <div id="actions" class="actions" aria-label="气泡操作"></div>
      <form id="composer" hidden>
        <label for="input">输入消息</label>
        <textarea id="input" maxlength="4000" rows="2"></textarea>
        <button type="submit">发送</button>
      </form>
      <footer>
        <button id="open-center" type="button">打开陪伴中心</button>
      </footer>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="./overlay.js"></script>
  </body>
</html>
